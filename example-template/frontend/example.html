<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пример — Altair</title>

  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/main.css">

  <script src="assets/js/api.js" defer></script>
  <script src="assets/js/header.js" defer></script>
  <script src="assets/js/example.js" defer></script>
</head>
<body>
  <!--
    example.html — рабочая заготовка новой страницы.

    Чтобы сделать свою страницу:
    1. Скопируйте этот файл, например, в ideas.html.
    2. Замените заголовок, подписи полей и id элементов.
    3. Скопируйте example.js в ideas.js и замените вызовы getNotes/createNote
       на функции своей сущности из api.js.
    4. Подключите новый скрипт в новом HTML и добавьте вкладку в шапку
       на всех страницах.

    Этот пример использует существующее API заметок, чтобы показать полный путь:
    HTML → JavaScript → fetch → Express → SQLite. Данные, добавленные здесь,
    появятся и на странице «Заметки».
  -->
  <header class="header">
    <div class="header__inner">
      <a class="brand" href="tasks.html" aria-label="Altair — задачи">
        <img class="brand__logo" src="assets/img/logo.svg" alt="">
        <span class="brand__name">Altair</span>
      </a>

      <!-- На странице-примере нет активной вкладки: она не входит в основное меню. -->
      <nav class="tabs" aria-label="Разделы">
        <a class="tab" href="tasks.html">
          <img src="assets/icon/tasks.svg" alt="">
          Задачи
        </a>
        <a class="tab" href="notes.html">
          <img src="assets/icon/notes.svg" alt="">
          Заметки
        </a>
        <a class="tab" href="reports.html">
          <img src="assets/icon/reports.svg" alt="">
          Отчёты
        </a>
      </nav>

      <button class="counter" id="click-counter" type="button">
        Нажатий: <span class="counter__value" id="click-count">0</span>
      </button>
    </div>
  </header>

  <main class="page">
    <div class="page__head">
      <img class="page__icon" src="assets/icon/notes.svg" alt="">
      <h1 class="page__title">Пример</h1>
    </div>

    <div class="layout">
      <section class="panel" aria-labelledby="example-form-title">
        <h2 class="panel__title" id="example-form-title">Заметка</h2>

        <!-- Упрощённая форма без времени: время подставляется в example.js. -->
        <form class="form" id="example-form">
          <label class="field">
            <span class="field__label">Название</span>
            <input class="input" id="example-title" type="text" required>
          </label>

          <label class="field">
            <span class="field__label">Текст</span>
            <textarea class="textarea" id="example-text" required></textarea>
          </label>

          <div class="form__actions">
            <button class="button button--primary" type="submit">Добавить</button>
          </div>
        </form>
      </section>

      <section class="panel" aria-labelledby="example-list-title">
        <h2 class="panel__title" id="example-list-title">Список</h2>

        <p class="empty" id="example-empty">Пусто</p>
        <ul class="list" id="example-list"></ul>
      </section>
    </div>
  </main>
</body>
</html>
