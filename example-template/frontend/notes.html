<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заметки — Altair</title>

  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/main.css">

  <script src="assets/js/api.js" defer></script>
  <script src="assets/js/header.js" defer></script>
  <script src="assets/js/notes.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <a class="brand" href="tasks.html" aria-label="Altair — задачи">
        <img class="brand__logo" src="assets/img/logo.svg" alt="">
        <span class="brand__name">Altair</span>
      </a>

      <nav class="tabs" aria-label="Разделы">
        <a class="tab" href="tasks.html">
          <img src="assets/icon/tasks.svg" alt="">
          Задачи
        </a>
        <a class="tab is-active" href="notes.html" aria-current="page">
          <img src="assets/icon/notes.svg" alt="">
          Заметки
        </a>
        <a class="tab" href="reports.html">
          <img src="assets/icon/reports.svg" alt="">
          Отчёты
        </a>
      </nav>

      <button class="counter" id="click-counter" type="button">
        Нажатий: <span class="counter__value" id="click-count">0</span>
      </button>
    </div>
  </header>

  <main class="page">
    <div class="page__head">
      <img class="page__icon" src="assets/icon/notes.svg" alt="">
      <h1 class="page__title">Заметки</h1>
    </div>

    <div class="layout">
      <section class="panel" aria-labelledby="note-form-title">
        <h2 class="panel__title" id="note-form-title">Заметка</h2>

        <form class="form" id="note-form">
          <label class="field">
            <span class="field__label">Название</span>
            <input class="input" id="note-title" type="text" name="title" required>
          </label>

          <label class="field">
            <span class="field__label">Текст</span>
            <textarea class="textarea" id="note-text" name="text" required></textarea>
          </label>

          <label class="field">
            <span class="field__label">Время</span>
            <input class="input" id="note-time" type="datetime-local" name="time" required>
          </label>

          <div class="form__actions">
            <button class="button button--primary" id="note-submit" type="submit">Добавить</button>
            <button class="button button--secondary" id="note-cancel" type="button" hidden>Отмена</button>
          </div>
        </form>
      </section>

      <section class="panel" aria-labelledby="note-list-title">
        <h2 class="panel__title" id="note-list-title">Список</h2>

        <p class="empty" id="note-empty">Пусто</p>
        <ul class="list" id="note-list"></ul>
      </section>
    </div>
  </main>
</body>
</html>
