<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altair — счётчик</title>

  <link rel="stylesheet" href="assets/css/main.css">
  <script src="assets/js/clicker.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <a class="brand" href="index.html">Altair</a>

      <nav class="nav" aria-label="Разделы">
        <a class="nav__link" href="index.html">Главная</a>
        <a class="nav__link is-active" href="clicker.html" aria-current="page">Счётчик</a>
        <a class="nav__link" href="todo.html">Задачи</a>
      </nav>
    </div>
  </header>

  <main class="clicker">
    <h1 class="visually-hidden">Счётчик нажатий</h1>

    <button class="heart-button" id="heart-button" type="button" aria-label="Увеличить счётчик нажатий">
      <img class="heart-button__icon" src="assets/icons/heart.svg" alt="">
    </button>

    <p class="clicker__count" aria-live="polite">
      <span class="clicker__number" id="click-count">0</span>
      <span class="clicker__label" id="click-label">нажатий</span>
    </p>

    <button class="reset" id="reset-button" type="button" hidden>Сбросить</button>
  </main>
</body>
</html>
